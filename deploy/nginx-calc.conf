# Inside the existing `server { ... }` block for adderoaks.com (443) in /etc/nginx/sites-enabled/adderoaks.com.
# Every location is ^~ so it wins over the vhost's static-extension regex (see the workspace CLAUDE.md).

# Hashed static files from collectstatic: cache for a year.
location ^~ /calc/static/ {
    alias /home/deploy/calc-course/web/staticfiles/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Lesson videos and captions, straight off disk. nginx answers Range requests itself (206), so seeking works
# and gunicorn never streams a 10 MB file. Names are not hashed, so cache for a day and revalidate.
location ^~ /calc/video/ {
    alias /home/deploy/calc-course/web/static/video/;
    types { video/mp4 mp4; text/vtt vtt; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff;
    sendfile on;
    tcp_nopush on;
    access_log off;
}

# AP FRQ Archive: College Board question pages (webp) and PDFs, public, straight off disk. Only build/frq/files/
# is exposed (the manifest and the raw mirror sit beside it, not in it). Django serves the same URLs in development.
location ^~ /calc/frq/file/ {
    alias /home/deploy/calc-course/build/frq/files/;
    types { image/webp webp; application/pdf pdf; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff;
    access_log off;
}

location = /calc { return 301 /calc/; }

location ^~ /calc/ {
    proxy_pass http://127.0.0.1:8018/;          # trailing slash strips /calc/ before Django sees the path
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;    # overwrite whatever the client sent; the rate limits trust this
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}
