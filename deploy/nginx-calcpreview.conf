# PREVIEW mount (2026-10-30): the whole site at https://adderoaks.com/calccoursepreview/ behind HTTP basic auth,
# for Adder's first students before the real launch on its own server. Inside the adderoaks.com 443 server block.
# Every location carries the password and noindex itself: an add_header in a location replaces the server's,
# and the ^~ prefixes are load-bearing (without them the vhost's static-extension regex serves .mp4/.css unauthenticated).
# Password file: sudo htpasswd -B /etc/nginx/.htpasswd-calcpreview <user>   (apache2-utils), owned root:www-data, 640.

# Hashed static files from collectstatic: cache for a year.
location ^~ /calccoursepreview/static/ {
    auth_basic "Mr Oaks Math preview";
    auth_basic_user_file /etc/nginx/.htpasswd-calcpreview;
    add_header X-Robots-Tag "noindex, nofollow" always;
    alias /home/deploy/calc-course/web/staticfiles/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Lesson videos and captions, straight off disk. nginx answers Range requests itself (206), so seeking works
# and gunicorn never streams a 10 MB file. Names are not hashed, so cache for a day and revalidate.
location ^~ /calccoursepreview/video/ {
    auth_basic "Mr Oaks Math preview";
    auth_basic_user_file /etc/nginx/.htpasswd-calcpreview;
    add_header X-Robots-Tag "noindex, nofollow" always;
    alias /home/deploy/calc-course/web/static/video/;
    types { video/mp4 mp4; text/vtt vtt; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff;
    sendfile on;
    tcp_nopush on;
    access_log off;
}

# AP FRQ Archive: College Board question pages (webp) and PDFs, public, straight off disk. Only build/frq/files/
# is exposed (the manifest and the raw mirror sit beside it, not in it). Django serves the same URLs in development.
location ^~ /calccoursepreview/frq/file/ {
    auth_basic "Mr Oaks Math preview";
    auth_basic_user_file /etc/nginx/.htpasswd-calcpreview;
    add_header X-Robots-Tag "noindex, nofollow" always;
    alias /home/deploy/calc-course/build/frq/files/;
    types { image/webp webp; application/pdf pdf; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options nosniff;
    access_log off;
}

location = /calccoursepreview { return 301 /calccoursepreview/; }

location ^~ /calccoursepreview/ {
    auth_basic "Mr Oaks Math preview";
    auth_basic_user_file /etc/nginx/.htpasswd-calcpreview;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://127.0.0.1:8018/;          # trailing slash strips /calccoursepreview/ before Django sees the path
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;    # overwrite whatever the client sent; the rate limits trust this
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}
