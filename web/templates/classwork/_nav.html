<div class="cw-head">
  <div class="cw-title"><h1>{{ c.name }}</h1><span class="muted">AP Calculus {{ c.course }} · {{ c.enrollments.count }} student{{ c.enrollments.count|pluralize }} · join code <strong>{{ c.code }}</strong></span>
    <a class="muted" href="{% url 'teacher' %}">All classes</a></div>
</div>
<nav class="cw-tabs" aria-label="Class sections">
  {% for key, label, url in cw_tabs %}<a href="{{ url }}"{% if tab == key %} class="on" aria-current="page"{% endif %}>{{ label }}</a>{% endfor %}
</nav>
